    <main>
        <div class="header-hero">
            <h1 class="hh-title">Contact</h1>
            <p class="hh-sub">What can I help you with? Send me a message!</p>
        </div>
        <div class="container">
            <div class="formWrapContainer">
                <form method="GET" action="thank.html">
                    <div class="formRow">
                        <label>To : <span id="nameButton">Eunice Ann</span><input type="text" name="to-email"
                                value="contact@euniceann.com" hidden title="Eunice's Email"></label>
                    </div>
                    <div class="formRow">
                        <label>From : <input type="email" name="from-email" required placeholder="john89@gmail.com"
                                title="Your Email" autocomplete="email"></label>
                    </div>
                    <div class="formRow">
                        <label>Contact No : <input type="tel" name="phone" autocomplete="tel"
                                title="A Phone Number with dashes" placeholder="987-555-1234"></label>
                    </div>
                    <div class="formRow" id="textArea">
                        <label for="message">Your Message: </label>
                        <textarea id="message" name="message" placeholder="Type your message here."
                            title="Describe your business or organization" rows="15"></textarea>

                        <!-- button -->
                        <input id="button" type="submit" value="Send Your Message 💌">
                    </div>
                </form>
            </div>
        </div>
    </main>
